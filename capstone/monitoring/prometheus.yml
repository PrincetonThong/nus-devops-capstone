global:
  scrape_interval: 10s

scrape_configs:
  - job_name: finsecurepay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - finsecurepay:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
