apiVersion: v1
# Namespace (finsecurepay)
kind: Namespace
metadata:
  name: finsecurepay

---

apiVersion: v1
# ConfigMap (finsecurepay-config)
kind: ConfigMap
metadata:
  name: finsecurepay-config
  namespace: finsecurepay
data:
  SPRING_APPLICATION_NAME: finsecurepay
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---

apiVersion: apps/v1
# Deployment (finsecurepay)
kind: Deployment
metadata:
  name: finsecurepay
  namespace: finsecurepay
spec:
  # at least 2 replicas
  replicas: 2

  selector:
    matchLabels:
      app: finsecurepay

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # no pod can be unavailable during update (means keep 2 pod avail)
      maxUnavailable: 0
      # no more than 1 extra pods can be created during update
      maxSurge: 1

  template:
    metadata:
      labels:
        app: finsecurepay

    spec:
      containers:
        - name: finsecurepay-container
          image: tjysats/nus-devops-capstone-finsecurepay:v1.0.0
          imagePullPolicy: IfNotPresent

          # Expose app port inside container on port 8080
          ports:
          - name: http
            containerPort: 8080

          # Inject ConfigMap as env var
          envFrom:
          - configMapRef:
              name: finsecurepay-config

          # Check if app can receive requests (readiness)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          # Check if app is alive (liveness)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"

---

apiVersion: v1
# svc to expose app externally (finsecurepay-service)
kind: Service
metadata:
  name: finsecurepay-service
  namespace: finsecurepay
spec:
  type: LoadBalancer

  selector:
    app: finsecurepay

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
